<script>

};
let state=loadState();
let currentScreen='home';
let currentSession=null;
let currentQuestion=null;

let lastBossRecommendations=[];
let dictionaryLessonFilter=[];
let importPreview={rows:0,parsed:0,errors:[],lessons:{},formatCounts:{}};

function clone(x){return JSON.parse(JSON.stringify(x))}
function loadState(){
  try{
    let raw=localStorage.getItem(APP_KEY);
    let sourceKey=APP_KEY;
    if(!raw){for(const key of LEGACY_KEYS){raw=localStorage.getItem(key);if(raw){sourceKey=key;break}}}
    if(!raw)return clone(defaults);
    const parsed=JSON.parse(raw);
    const normalized=normalizeState(parsed);
    if(sourceKey!==APP_KEY){try{localStorage.setItem(APP_KEY,JSON.stringify(normalized))}catch(e){}}
    return normalized;
  }catch(e){return clone(defaults)}
}
function normalizeState(s){
  const out=clone(defaults);
  if(!s || typeof s!=='object') return out;
  out.version=DATA_VERSION;
  out.words=Array.isArray(s.words)?s.words.map(normalizeWord).filter(w=>w.hanzi&&w.pinyin&&w.meaning&&looksLikeHanzi(w.hanzi)&&looksLikePinyin(w.pinyin)):[];
  out.selectedLessons=Array.isArray(s.selectedLessons)?s.selectedLessons.map(String):[];
  out.coins=num(s.coins,120); out.xp=num(s.xp,0); out.combo=num(s.combo,0); out.bestCombo=num(s.bestCombo,0);
  out.progress=(s.progress&&typeof s.progress==='object')?s.progress:{};
  out.inventory={...out.inventory,...(s.inventory||{})};
  for(const k of ['shield','crystal','scroll','amulet','challenge','bossTicket'])out.inventory[k]=Math.max(0,Math.floor(num(out.inventory[k],0)));
  out.ownedThemes=Array.isArray(s.ownedThemes)&&s.ownedThemes.length?s.ownedThemes:['default'];
  out.activeTheme=THEMES[s.activeTheme]?s.activeTheme:'default';
  out.pet={...out.pet,...(s.pet||{})};
  out.pet.friendship=Math.max(0,Math.floor(num(out.pet.friendship,0)));
  out.pet.ownedToys=Array.isArray(out.pet.ownedToys)?out.pet.ownedToys:[];
  out.pet.ownedPets=Array.isArray(out.pet.ownedPets)&&out.pet.ownedPets.length?out.pet.ownedPets:['cat'];
  out.pet.activePet=out.pet.ownedPets.includes(out.pet.activePet)?out.pet.activePet:'cat';
  out.settings={...out.settings,...(s.settings||{})};
  return out;
}
function normalizeWord(w){
  const rawLessons=Array.isArray(w?.lessons)?w.lessons:(w?.lesson?[String(w.lesson)]:[]);
  const lessons=[...new Set(rawLessons.flatMap(v=>String(v??'').split(/\s*\|\s*/).map(x=>x.trim()).filter(Boolean)))];
  return {
    id:String(w?.id||hashId(`${w?.hanzi||''}|${w?.pinyin||''}`)),
    hanzi:String(w?.hanzi||'').trim(),
    pinyin:String(w?.pinyin||'').trim(),
    meaning:String(w?.meaning||'').trim(),
    sentence:String(w?.sentence||'').trim(),
    sentenceRu:String(w?.sentenceRu||'').trim(),
    lessons,
    lesson:lessons[0]||''
  };
}
function num(v,f){return Number.isFinite(Number(v))?Number(v):f}
function save(){try{localStorage.setItem(APP_KEY,JSON.stringify(state))}catch(e){} applyTheme(); render();}
function hashId(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)}
function esc(v){return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function localDay(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function seeded(n){let x=Math.sin(n)*10000;return x-Math.floor(x)}
function hashNum(str){let h=0;for(let i=0;i<str.length;i++)h=(h*31+str.charCodeAt(i))|0;return Math.abs(h)}
function shuffle(arr,seedStr=''){let a=arr.slice(), seed=hashNum(seedStr)||1;for(let i=a.length-1;i>0;i--){seed=(seed*1664525+1013904223)>>>0;const j=seed%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}

function applyTheme(){document.body.dataset.theme=state.activeTheme||'default'}
function getWord(id){return state.words.find(w=>w.id===id)}
function wordLessons(w){
  if(Array.isArray(w.lessons))return w.lessons.filter(Boolean);
  return w.lesson?[w.lesson]:[];
}
function lessonNames(){
  const set=new Set();
  state.words.forEach(w=>wordLessons(w).forEach(l=>set.add(l)));
  if(state.words.some(w=>!wordLessons(w).length))set.add('Без урока');
  return [...set].sort((a,b)=>a.localeCompare(b,'ru',{numeric:true}));
}
function wordHasLesson(w,lesson){return lesson==='Без урока'?!wordLessons(w).length:wordLessons(w).includes(lesson)}
function filteredWords(){
  if(!state.selectedLessons.length) return state.words.slice();
  return state.words.filter(w=>{
    const ls=wordLessons(w);
    return state.selectedLessons.some(l=>l==='Без урока'?!ls.length:ls.includes(l));
  });
}
function ensureProgress(w){
  if(!state.progress[w.id]) state.progress[w.id]={meaning:0,pinyin:0,listening:0,writing:0,context:0,attempts:0,errors:0,last:0};
  return state.progress[w.id];
}
function skillName(s){return ({meaning:'значение',pinyin:'пиньинь',listening:'аудирование',writing:'написание',context:'контекст',hanzi:'иероглиф'})[s]||s}
function eligibleSkills(w){
  const arr=['meaning','pinyin','listening','writing'];
  if(w.sentence) arr.push('context');
  return arr;
}
function wordMastery(w){
  const p=ensureProgress(w);
  const skills=eligibleSkills(w);
  const vals=skills.map(s=>p[s]||0);
  return vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):0;
}
function allMastered(words=filteredWords()){
  if(!words.length) return false;
  return words.every(w=>{const p=ensureProgress(w);const skills=eligibleSkills(w);return wordMastery(w)>=80 && skills.every(s=>(p[s]||0)>=60)});
}
function remainingMastered(words=filteredWords()){
  return words.filter(w=>!allMastered([w]));
}
function skillWeakness(w){
  const p=ensureProgress(w);return ['meaning','pinyin','listening','writing','context'].sort((a,b)=>p[a]-p[b])}
function chooseWordSkill(words=filteredWords(),preferred=null){
  if(!words.length) return null;
  const pool=words.slice();
  const ranked=pool.sort((a,b)=>wordMastery(a)-wordMastery(b));
  const w=ranked[Math.floor(Math.random()*Math.min(3,ranked.length))];
  let skill=preferred||skillWeakness(w)[0];
  if(!eligibleSkills(w).includes(skill)) skill=eligibleSkills(w)[0];
  return {word:w,skill};
}
function optionsFor(skill,correct,count=4){
  const source=state.words.filter(w=>w.id!==correct.id);
  const pool=shuffle(source,correct.id+'|'+skill+'|'+localDay());
  const label=w=>{
    if(skill==='meaning') return w.meaning||'—';
    if(skill==='pinyin') return w.pinyin||'—';
    return w.hanzi||'—';
  };
  const out=[{id:correct.id,label:label(correct),correct:true}];
  for(const w of pool){
    if(out.length>=Math.min(count,source.length+1))break;
    const lbl=label(w);if(lbl&&lbl!==label(correct)&&!out.some(x=>x.label===lbl))out.push({id:w.id,label:lbl,correct:false});
  }
  return shuffle(out,correct.id+'|opts|'+skill+'|'+localDay());
}
function reward(correct,{boss=false,challenge=false}={}){
  if(boss) return {coins:0,xp:correct?5:0};
  const mult=challenge?2:1;
  if(correct){
    const coins=3*mult, xp=5*mult;
    state.coins+=coins; state.xp+=xp; state.combo+=1; state.bestCombo=Math.max(state.bestCombo,state.combo);
    return {coins,xp};
  }
  if(state.inventory.shield>0 && !challenge){state.inventory.shield--;return {coins:0,xp:0,shieldUsed:true};}
  state.combo=0; state.coins=Math.max(0,state.coins-1);
  return {coins:-1,xp:0};
}
function updateProgress(w,skill,correct){
  const p=ensureProgress(w);p.attempts++;p.last=Date.now();
  const key=skill==='hanzi'?'writing':skill;
  p[key]=Math.max(0,Math.min(100,p[key]+(correct?18:-7)));
  if(!correct)p.errors++;
}

function getShopItems(){

function buyItem(id){
  const all=[...SHOP_POOL,{id:'boss_ticket',kind:'ticket',icon:'🎟️',name:'Boss Ticket',price:300,desc:'Особый билет для босса.'}];
  const item=all.find(i=>i.id===id);if(!item)return;
  if(state.coins<item.price){toast('Недостаточно монет 🪙');return}
  if(item.kind==='theme' && state.ownedThemes.includes(item.theme)){toast('Эта тема уже куплена');return}
  if(item.kind==='toy' && state.pet.ownedToys.includes(item.id)){toast('Эта игрушка уже у питомца');return}
  state.coins-=item.price;
  if(item.kind==='theme'){
    state.ownedThemes=[...new Set([...state.ownedThemes,item.theme])];state.activeTheme=item.theme;
    toast(`Открыта тема: ${item.name}`);petReact('happy');
  }else if(item.kind==='toy'){
    state.pet.ownedToys=[...new Set([...state.pet.ownedToys,item.id])];state.pet.activeToy=item.id;state.pet.friendship+=1;
    toast(`Питомец получил ${item.name}! +1 дружба`);petReact('celebrate');
  }else if(item.kind==='ticket'){
    state.inventory.bossTicket=(state.inventory.bossTicket||0)+1;toast('Boss Ticket куплен');
  }else{
    state.inventory[item.id]=(state.inventory[item.id]||0)+1;toast(`Куплено: ${item.name}`);
  }
  save();openStore();
}
function buyPetOrSelect(id){
  const pet=PET_TYPES[id]; if(!pet) return;

function pickSessionSkill(word,preferred){
  const skills=eligibleSkills(word);
  if(preferred && skills.includes(preferred))return preferred;
  const weak=skillWeakness(word);
  return weak.find(s=>skills.includes(s))||skills[0];
}
function buildUniqueSequence(words,count,mode){
  const pool=shuffle(words, `${localDay()}|${mode}|${words.map(w=>w.id).join(',')}`);
  if(!pool.length)return [];
  const out=[];
  const cycle=skillCycleForWords(words);
  let cycleIndex=0;
  let round=0;
  // Round 1: every eligible word appears before any repeat.
  while(out.length<count){
    const roundWords=round===0?pool:shuffle(words,`${localDay()}|${mode}|round|${round}`);
    for(const w of roundWords){
      if(out.length>=count)break;
      const lastId=out[out.length-1]?.word?.id;
      if(w.id===lastId && roundWords.length>1) continue;
      const preferred=cycle[cycleIndex%cycle.length];
      out.push({word:w,skill:pickSessionSkill(w,preferred)});
      cycleIndex++;
    }
    round++;
    if(round>100)break;
  }
  return out;
}
function makeSession(mode='quest',words=filteredWords(),length=null,rewardMultiplier=1,title='Тренировка'){
  words=words.length?words:filteredWords();
  if(!words.length){toast('Сначала добавь слова в словарь');return null}
  let count=length||10;
  if(mode==='context'){
    words=words.filter(w=>w.sentence);
    if(!words.length){toast('Для контекста нужны примеры предложений в словаре. Добавь их через импорт.');return null}
  }
  let plan;
  if(mode==='quest') plan=buildUniqueSequence(words,count,mode);
  else {
    const eligible=mode==='context'?words:words;
    let round=0;
    plan=[];
    while(plan.length<count){
      const roundWords=shuffle(eligible,`${localDay()}|${mode}|unique|round${round}`);
      for(const w of roundWords){
        if(plan.length>=count)break;
        const last=plan[plan.length-1]?.word?.id;
        if(w.id===last && roundWords.length>1) continue;
        plan.push({word:w,skill:mode});
      }
      round++;
      if(round>100)break;
    }
  }
  return {type:mode,title,questions:plan,index:0,correct:0,errors:[],rewardMultiplier};
}

function buildBossPlan(words){
  if(!words.length)return [];
  const plan=[];const skillOrder=['meaning','pinyin','listening','writing','context'];const used=new Map();
  const base=shuffle(words,'boss-base-'+localDay());
  // First pass: every word appears once, but the skills are deliberately distributed.
  for(let i=0;i<base.length&&plan.length<50;i++){
    const w=base[i],skills=eligibleSkills(w);let desired=skillOrder[i%skillOrder.length];
    let skill=skills.includes(desired)?desired:(skills.find(x=>x===skillOrder[(i+1)%skillOrder.length])||skills[0]);
    plan.push({word:w,skill});used.set(w.id,[skill]);
  }
  // Remaining questions: repeat words with a different skill whenever possible.
  let round=1;
  while(plan.length<50){
    let added=0;const rotated=shuffle(words,`boss-round-${round}-${localDay()}`);
    rotated.forEach((w,idx)=>{
      if(plan.length>=50)return;
      const skills=eligibleSkills(w),prior=used.get(w.id)||[];
      let skill=skillOrder[(round+idx)%skillOrder.length];
      const alternatives=skillOrder.filter(x=>skills.includes(x)&&!prior.includes(x));
      if(!skills.includes(skill)||prior.includes(skill))skill=alternatives[0]||skills[(round+idx)%skills.length];
      if(!skill)return;
      plan.push({word:w,skill});used.set(w.id,[...prior,skill]);added++;
    });
    if(!added)break;
    round++;if(round>12)break;
  }
  return plan.slice(0,50);
}

function drawLocalGuide(word,animate=false,showTarget=false){
  const guide=document.getElementById('writerGuide');if(!guide)return;
  const g=guide.getContext('2d');g.clearRect(0,0,guide.width,guide.height);
  const w=guide.width,h=guide.height;
  g.strokeStyle='rgba(120,120,120,.14)';g.lineWidth=2;
  g.beginPath();g.moveTo(w/2,20);g.lineTo(w/2,h-20);g.moveTo(20,h/2);g.lineTo(w-20,h/2);g.stroke();
  const fitFont=()=>{let size=Math.min(w*0.68,h*0.68);g.font=`900 ${size}px "PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Sans CJK","Microsoft YaHei",sans-serif`;while(g.measureText(word.hanzi).width>w*0.76&&size>120){size-=8;g.font=`900 ${size}px "PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Sans CJK","Microsoft YaHei",sans-serif`};return size};
  fitFont();g.textAlign='center';g.textBaseline='middle';
  if(showTarget){
    g.fillStyle='rgba(186,122,61,.08)';g.fillText(word.hanzi,w/2,h/2+6);
    if(animate){g.strokeStyle='rgba(186,122,61,.50)';g.lineWidth=Math.max(4,w/120);g.lineJoin='round';g.setLineDash([16,10]);g.lineDashOffset=-(Date.now()/7)%120;g.strokeText(word.hanzi,w/2,h/2+6)}
    else {g.strokeStyle='rgba(186,122,61,.26)';g.lineWidth=Math.max(3,w/150);g.strokeText(word.hanzi,w/2,h/2+6)}
  }
}
function setupLocalWriter(word,isBoss=false){
  const target=document.getElementById('hanziWriter');if(!target)return;
  target.innerHTML=`<div class="writer-stage"><canvas id="writerGuide" class="writer-guide" width="640" height="640"></canvas><canvas id="writeCanvas" class="writer-ink" width="640" height="640"></canvas></div><div class="local-writer-tools"><button class="secondary" data-action="localHint">👁️ Показать подсказку</button><button class="ghost" data-action="writerRestart">🔄 Заново</button></div><div id="localWriterStatus" class="local-writer-status">Поле готово. Здесь нет готового иероглифа — сначала попробуй по значению. Подсказка покажет форму.</div><div class="local-writer-tools"><button class="primary" data-action="checkWriting">Проверить</button></div>`;
  canvas=document.getElementById('writeCanvas');ctx=canvas.getContext('2d',{willReadFrequently:true});drawing=false;hasInk=false;
  ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=getComputedStyle(document.body).getPropertyValue('--text').trim()||'#222';ctx.lineWidth=12;
  drawLocalGuide(word,false,false);
  let raf=0,lastPointerAt=0;
  const repaint=()=>{drawLocalGuide(word,true);raf=requestAnimationFrame(repaint)};
  const stopAnim=()=>{if(raf)cancelAnimationFrame(raf);raf=0;drawLocalGuide(word,false)};
  const pos=(clientX,clientY)=>{const r=canvas.getBoundingClientRect();return {x:(clientX-r.left)*canvas.width/r.width,y:(clientY-r.top)*canvas.height/r.height}};
  const begin=(clientX,clientY,pressure=.5)=>{const p=pos(clientX,clientY);drawing=true;hasInk=true;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineWidth=Math.max(7,Math.min(18,8+pressure*8));stopAnim();const st=document.getElementById('localWriterStatus');if(st)st.textContent='Пишем…'};
  const move=(clientX,clientY,pressure=.5)=>{if(!drawing)return;const p=pos(clientX,clientY);ctx.lineWidth=Math.max(7,Math.min(18,8+pressure*8));ctx.lineTo(p.x,p.y);ctx.stroke()};
  const end=()=>{if(!drawing)return;drawing=false;try{ctx.closePath()}catch(_){}const st=document.getElementById('localWriterStatus');if(st)st.textContent='Готово. Нажми «Проверить» ниже.'};
  canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;lastPointerAt=Date.now();e.preventDefault();canvas.setPointerCapture?.(e.pointerId);begin(e.clientX,e.clientY,e.pressure||.5)});

  canvas.addEventListener('pointerup',e=>{lastPointerAt=Date.now();e.preventDefault();try{canvas.releasePointerCapture?.(e.pointerId)}catch(_){}end()});
  canvas.addEventListener('pointercancel',e=>{lastPointerAt=Date.now();end()});
  const touchPoint=t=>({x:t.clientX,y:t.clientY,pressure:typeof t.force==='number'&&t.force>0?t.force:.6});
  canvas.addEventListener('touchstart',e=>{if(Date.now()-lastPointerAt<200)return;e.preventDefault();const t=e.changedTouches[0];if(t)begin(t.clientX,t.clientY,t.force||.6)},{passive:false});
  canvas.addEventListener('touchmove',e=>{if(!drawing||Date.now()-lastPointerAt<200)return;e.preventDefault();const t=e.changedTouches[0];if(t)move(t.clientX,t.clientY,t.force||.6)},{passive:false});
  canvas.addEventListener('touchend',e=>{if(Date.now()-lastPointerAt<200)return;e.preventDefault();end()},{passive:false});
}

function parseDelimitedLine(line,sep){
  const cells=[];let cur='',q=false;
  for(let i=0;i<line.length;i++){

    if(ch==='"'){

      else q=!q;
    }else if(ch===sep&&!q){cells.push(cur.trim());cur='';}
    else cur+=ch;
  }
  cells.push(cur.trim());
  return cells;
}
function detectHeader(row){
  const norm=row.map(x=>String(x||'').toLowerCase().replace(/[\s_\-№]/g,''));
  const hasH=norm.some(x=>['汉字','hanzi','word','слово','иероглиф','китайское'].includes(x)||x.includes('hanzi')||x.includes('иероглиф'));
  const hasP=norm.some(x=>['拼音','pinyin','пиньинь','reading','чтение'].includes(x)||x.includes('pinyin'));
  const hasM=norm.some(x=>['翻译','перевод','значение','meaning','translation','translationru','переводru','russian','rus'].includes(x)||x.includes('перевод')||x.includes('meaning'));

function parseLessonHeading(line){
  const raw=String(line||'').trim();
  let m=raw.match(/^(?:урок|lesson|unit)\s*№?\s*([0-9]+)(?:\s*[:.\-–—]\s*(.+))?$/i);
  if(m)return `Урок ${m[1]}${m[2]?` — ${m[2].trim()}`:''}`;
  m=raw.match(/^([0-9]+)\s*(?:урок|lesson|unit)$/i);if(m)return `Урок ${m[1]}`;
  m=raw.match(/^第\s*([0-9]+)\s*课$/i);if(m)return `Урок ${m[1]}`;
  return '';
}

function looksLikePinyin(v){

    const n=x.match(/^(?:урок|lesson|unit)\s*№?\s*(\d+)(?:\s*[.:\-–—]\s*(.*))?$/i)||x.match(/^(\d+)\s*(?:урок|lesson|unit)$/i)||x.match(/^第\s*(\d+)\s*课$/i);

function chooseSeparatorCells(line){

  for(const sep of seps){
    const cells=parseDelimitedLine(line,sep).map(x=>x.trim());
    const nonEmpty=cells.filter(Boolean);
    let score=-1000;
    if(cells.length>=3)score=10+cells.length;
    if(cells.length>=3&&looksLikeHanzi(cells[0]))score+=30;
    if(cells.length>=3&&looksLikePinyin(cells[1]))score+=40;
    if(cells.length>=3&&cells[2])score+=10;
    if(sep===',')score-=2;
    if(nonEmpty.length>=3)score+=4;

function mergeWords(words){

    const w=normalizeWord(raw),old=map.get(w.id);

    const merged={...old};
    merged.lessons=[...new Set([...(old.lessons||[]),...(w.lessons||[])])];
    merged.lesson=merged.lessons[0]||'';
    if(!merged.sentence&&w.sentence)merged.sentence=w.sentence;
    if(!merged.sentenceRu&&w.sentenceRu)merged.sentenceRu=w.sentenceRu;
    if(!merged.meaning&&w.meaning)merged.meaning=w.meaning;

function decodeTextBuffer(buf){

    const utf=new TextDecoder('utf-8',{fatal:false}).decode(buf);
    const bad=(utf.match(/�/g)||[]).length;
    if(!bad||hasUtf8Bom||has16)return utf;
  }catch(e){}

}

  const mode=e.target.closest('[data-mode]');if(mode){startMode(mode.dataset.mode);return}
  const lesson=e.target.closest('[data-lesson]');if(lesson){toggleLesson(lesson.dataset.lesson);return}
  const lessonOnly=e.target.closest('[data-lesson-only]');if(lessonOnly){state.selectedLessons=[lessonOnly.dataset.lessonOnly];save();currentScreen='lessons';render();return}
  if(e.target.closest('[data-lesson-all]')){state.selectedLessons=[];save();return}
  const petSet=e.target.closest('[data-pet-set]');if(petSet){buyPetOrSelect(petSet.dataset.petSet);return}
  const dictLesson=e.target.closest('[data-dict-lesson]');if(dictLesson){const l=dictLesson.dataset.dictLesson;if(l==='__all')dictionaryLessonFilter=[];else{const set=new Set(dictionaryLessonFilter);set.has(l)?set.delete(l):set.add(l);dictionaryLessonFilter=[...set]}render();return}
  const answer=e.target.closest('[data-answer-id]');if(answer){answerCurrent(answer.dataset.answerId);return}
  const bossAns=e.target.closest('[data-boss-answer]');if(bossAns){bossAnswer(bossAns.dataset.bossAnswer);return}
  const review=e.target.closest('[data-review-skill]');if(review){closeModals();currentScreen='session';reviewSkill(review.dataset.reviewSkill);return}
  const buy=e.target.closest('[data-buy]');if(buy){buyItem(buy.dataset.buy);return}
  const theme=e.target.closest('[data-theme-set]');if(theme){state.activeTheme=theme.dataset.themeSet;save();openStore();return}
  const action=e.target.closest('[data-action]')?.dataset.action;
  if(action){
    if(action==='store')openStore();
    else if(action==='toyReact')petToyReact();
    else if(action==='settings')openSettings();
    else if(action==='continue')continueTraining();
    else if(action==='lessonFilter')currentScreen='library',render();
    else if(action==='importText')importText();
    else if(action==='backupExport')exportBackup();
    else if(action==='clearWords')clearWords();
    else if(action==='startBoss')startBoss();
    else if(action==='bossRetry')bossRetry();
    else if(action==='leaveSession')leaveSession();
    else if(action==='leaveBoss')leaveBoss();
    else if(action==='clearCanvas')clearCanvas();
    else if(action==='checkWriting')checkWriting();
    else if(action==='finishWriting')finishWriting();
    else if(action==='writerHint')writerHint();
    else if(action==='localHint')localHint();
    else if(action==='writerRestart')writerRestart();
    else if(action==='retryAudio')retryAudio();
    else if(action==='speak')speakWord(currentQuestion.word);
    else if(action==='speakBoss')speakBoss();
    else if(action==='continueAfterSession'){const prior=currentSession?.type||'quest';currentSession=null;currentQuestion=null;if(prior==='quest')continueTraining();else startMode(prior,{length:10,title:'Следующая серия'})}
    else if(action==='resetState')resetState();
    else if(action==='startChallenge'){closeModals();startChallenge();}
  }
  if(e.target.closest('[data-close-modal]'))closeModals();
  if(e.target.closest('[data-review-first]')){const r=lastBossRecommendations[0];if(r)reviewSkill(r.skill)}
});
document.addEventListener('input',e=>{if(e.target.id==='speechRate'){state.settings.speechRate=Number(e.target.value);saveNoRender();renderSettings()}});

// Keyboard shortcut is deliberately small; pointer/touch is primary.
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModals();});
applyTheme();render();
</script>
</body>
</html>
